<h1 id="user-content-岡部倫太郎">岡部倫太郎<a class="heading-anchor" href="#user-content-岡部倫太郎" data-anchor="user-content-岡部倫太郎" aria-label="Copy link to this section">#</a></h1>
<p><strong>岡部倫太郎</strong>（おかべ りんたろう）は、<a class="wikilink" data-wiki-target="future-gadget-lab" href="#">未来ガジェット研究所</a>の創設者にして自称マッドサイエンティスト。通り名は<mark class="wiki-highlight">鳳凰院凶真</mark>、ラボメンNo.001。</p>
<p><a class="wikilink" data-wiki-target="mayuri" href="#">椎名まゆり</a>、<a class="wikilink" data-wiki-target="daru" href="#">橋田至</a>、そして<a class="wikilink" data-wiki-target="kurisu" href="#">牧瀬紅莉栖</a>と共に<a class="wikilink" data-wiki-target="phone-microwave" href="#">電話レンジ（仮）</a>を開発し、<a class="wikilink" data-wiki-target="d-mail" href="#">Dメール</a>の発見をきっかけに<a class="wikilink" data-wiki-target="sern" href="#">SERN</a>との戦いに巻き込まれていく。世界線の移動を越えて記憶を保持する能力は<mark class="wiki-highlight">リーディング・シュタイナー</mark>と呼ばれる。</p>
